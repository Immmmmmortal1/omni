name: OmniAR
options:
  bundleIdPrefix: com.omni
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages: {}
targets:
  OmniAR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    sources:
      - path: OmniAR
        excludes:
          - "Models/**"
          - "Resources/Decals/**"
      - path: OmniAR/Models/yolo11s.mlpackage
        buildPhase: sources
    resources:
      - path: OmniAR/Models/yolo11s.mlpackage
        buildPhase: sources
      # Explicit so PNG sequences are copied even if source-glob misses them.
      - path: OmniAR/Resources/DecalFlat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omni.livingobjects
        PRODUCT_NAME: OmniAR
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OmniAR
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "OmniAR uses the camera for AR world tracking and object detection."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "OmniAR may use the microphone for future voice interaction."
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        COREML_CODEGEN_LANGUAGE: Swift
        COREML_COMPILER_CONTAINER: bundle-resources
    info:
      path: OmniAR/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "OmniAR uses the camera for AR world tracking and object detection."
        NSMicrophoneUsageDescription: "OmniAR may use the microphone for future voice interaction."
        UIRequiredDeviceCapabilities:
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        DEEPSEEK_API_KEY: "$(DEEPSEEK_API_KEY)"
        DEEPSEEK_MODEL: "$(DEEPSEEK_MODEL)"
